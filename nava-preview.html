  q(".wc").innerHTML=ext?`<iframe src="${u.replace(/"/g,"%22")}" referrerpolicy="no-referrer" sandbox="allow-scripts allow-forms allow-same-origin allow-popups"></iframe>`:u==="nava://about"?'<div class="bw"><h2>Nava Browser</h2><p style="color:var(--tx2)">Tabs, history and an address bar. Many sites refuse to load inside another page, so use Open in tab for those.</p></div>':'<div class="bw"><h2>Search the web</h2><input class="bq" placeholder="Search or enter an address" aria-label="Search" autocomplete="off"><div class="qk">'+[["Wikipedia","nava://wiki/Linux"],["GitHub","https://github.com"],["YouTube","https://www.youtube.com"],["About","nava://about"]].map(([n,l])=>`<button data-go="${l}">${n}</button>`).join("")+"</div></div>"}
 const go=u=>{const t=T[c];u=norm(u);t.h=t.h.slice(0,t.i+1);t.h.push(u);t.i++;draw()};
 b.onclick=e=>{const t=e.target.closest("button,i");if(!t)return;const d=t.dataset;
  if(d.go)go(d.go);else if(d.n){T.push({h:["nava://start"],i:0});c=T.length-1;draw()}
  else if(d.x!==undefined){T.splice(+d.x,1);if(!T.length)T.push({h:["nava://start"],i:0});c=Math.min(c,T.length-1);draw()}
  else if(d.t!==undefined){c=+d.t;draw()}
  else if(d.a==="b"&&T[c].i>0){T[c].i--;draw()}else if(d.a==="f"&&T[c].i<T[c].h.length-1){T[c].i++;draw()}else if(d.a==="r")draw()};
 b.onkeydown=e=>{if(e.key==="Enter"&&(e.target.classList.contains("url")||e.target.classList.contains("bq")))go(e.target.value)};
 draw();
}
function addLx(n){n=String(n).toLowerCase().replace(/[^a-z0-9-]/g,"");if(!n||APPS[n])return;APPS[n]={t:n[0].toUpperCase()+n.slice(1),i:'<rect x="4" y="5" width="16" height="14" rx="3"/><path d="M4 9h16"/>',c:"linear-gradient(135deg,#a3e635,#16a34a)",b:b=>{b.innerHTML=`<p><b>${n}</b> is a simulated Linux app.</p><p style="color:var(--tx2)">In a real Nava system, Linux apps would run natively in the compositor.</p>`}};if(!S.lx)S.lx=[];if(!S.lx.includes(n)){S.lx.push(n);save()}dock()}
$("#dock").addEventListener("pointermove",e=>document.querySelectorAll("#dock button").forEach(b=>{const r=b.getBoundingClientRect(),s=1+.55*Math.max(0,1-Math.abs(e.clientX-r.left-r.width/2)/110);b.style.transform=`translateY(${-(s-1)*14}px) scale(${s})`}));
$("#dock").addEventListener("pointerleave",()=>document.querySelectorAll("#dock button").forEach(b=>b.style.transform=""));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function pickAcc(i){save();S.cur=i;S.name=S.acs[i].name;S.pw=S.acs[i].pw;save();applyS()}
function showSetup(add){$("#setup").classList.add("open");$("#sh").textContent=add?"Add an account":"Create your account";$("#sc2").style.display=add?"":"none";["#s1","#s2","#s3"].forEach(s=>$(s).value="");$("#se").textContent="";setTimeout(()=>$("#s1").focus(),60)}
$("#sc2").onclick=()=>$("#setup").classList.remove("open");
$("#setup").onkeydown=e=>{if(e.key==="Enter")$("#sb").click()};
$("#lac").onclick=e=>{const t=e.target.closest("button");if(t){e.stopPropagation();pickAcc(+t.dataset.ac)}};
$("#sb").onclick=async()=>{const n=$("#s1").value.trim(),p=$("#s2").value,e=$("#se");
 if(!n)return e.textContent="Enter a name.";
 if(S.acs.some(a=>a.name.toLowerCase()===n.toLowerCase()))return e.textContent="That name is already used.";
 if(p!==$("#s3").value)return e.textContent="Passwords don’t match.";
 if(p&&p.length<4)return e.textContent="Use at least 4 characters.";
 save();S.acs.push({name:n,pw:p?await H(p):null,c:ACC[S.acs.length%ACC.length]});S.cur=S.acs.length-1;S.name=n;S.pw=S.acs[S.cur].pw;save();$("#setup").classList.remove("open");applyS();lock(false)};
async function reader(el,u){
 const wk="https://en.wikipedia.org/w/api.php?format=json&origin=*&action=query&",q0=u.startsWith("nava://search")?decodeURIComponent(u.split("q=")[1]||""):"";
 el.innerHTML='<div class="bw"><p>Loading…</p></div>';
 try{
  if(q0||u==="nava://search"){const r=(await(await fetch(wk+"list=search&srlimit=10&srsearch="+encodeURIComponent(q0))).json()).query.search,dec=s=>new DOMParser().parseFromString(s,"text/html").body.textContent;
   el.innerHTML='<div class="rd"><h3>Results for “'+esc(q0)+'”</h3>'+(r.length?r.map(x=>`<button class="hit" data-go="nava://wiki/${encodeURIComponent(x.title)}"><b>${esc(x.title)}</b><span>${esc(dec(x.snippet))}</span></button>`).join(""):"<p>No results.</p>")+`<p><a target="_blank" rel="noopener" href="https://duckduckgo.com/?q=${encodeURIComponent(q0)}">Search the web in a new tab ↗</a></p></div>`}
  else{const t=decodeURIComponent(u.slice(12)),p=Object.values((await(await fetch(wk+"prop=extracts|info&inprop=url&explaintext=1&redirects=1&titles="+encodeURIComponent(t))).json()).query.pages)[0];
   el.innerHTML=`<div class="rd"><h3>${esc(p.title)}</h3><pre class="ar">${esc((p.extract||"No article found.").slice(0,7000))}</pre><p><a target="_blank" rel="noopener" href="${esc(p.fullurl||"https://en.wikipedia.org")}">Open on Wikipedia ↗</a></p></div>`}
 }catch(e){el.innerHTML='<div class="bw"><h2>Can’t reach the internet</h2><p style="color:var(--tx2)">This hosted page can’t make web requests. Download the file and open it on your computer to browse online.</p>'+(q0?`<p><a target="_blank" rel="noopener" href="https://duckduckgo.com/?q=${encodeURIComponent(q0)}">Search in a new tab ↗</a></p>`:"")+'</div>'}
}
function cmds(){
 const a=Object.keys(APPS).map(k=>({n:APPS[k].t,s:"App",f:()=>openApp(k)}));
 return a.concat([
  {n:"Tile windows",s:"Layout",f:tile},
  {n:"Lock screen",s:"System",f:()=>lock(true)},
  {n:"Toggle dark mode",s:"Theme",f:()=>setTheme(isDark()?"light":"dark")},
  {n:"Open Control Center",s:"System",f:()=>setTimeout(()=>$("#cc").classList.add("open"),30)},
  {n:"Workspace 1",s:"Workspace",f:()=>gotoWs(0)},
  {n:"Workspace 2",s:"Workspace",f:()=>gotoWs(1)},
  {n:"Workspace 3",s:"Workspace",f:()=>gotoWs(2)}]);
}
function renderRes(){
 const q=$("#q").value.toLowerCase();
 list=cmds().filter(c=>c.n.toLowerCase().includes(q));
 sel=Math.min(sel,Math.max(0,list.length-1));
 $("#res").innerHTML=list.map((c,i)=>`<button class="${i===sel?"sel":""}" data-i="${i}">${c.n}<small>${c.s}</small></button>`).join("");
}
function cmd(open){
 const c=$("#cmd");
 if(open===undefined)open=!c.classList.contains("open");
 c.classList.toggle("open",open);
 if(open){$("#cc").classList.remove("open");$("#q").value="";sel=0;renderRes();setTimeout(()=>$("#q").focus(),20)}
}
function run(i){const c=list[i];if(c){cmd(false);c.f()}}
$("#q").oninput=()=>{sel=0;renderRes()};
$("#q").onkeydown=e=>{
 if(e.key==="ArrowDown"){sel=Math.min(list.length-1,sel+1);renderRes();e.preventDefault()}
 else if(e.key==="ArrowUp"){sel=Math.max(0,sel-1);renderRes();e.preventDefault()}
 else if(e.key==="Enter")run(sel);
};
$("#res").onclick=e=>{const b=e.target.closest("button");if(b)run(+b.dataset.i)};
$("#cmd").onclick=e=>{if(e.target.id==="cmd")cmd(false)};
$("#nv").onclick=()=>cmd();
$("#st").onclick=()=>{cmd(false);$("#cc").classList.toggle("open")};
$("#dock").onclick=e=>{const b=e.target.closest("button");if(b)openApp(b.dataset.a)};
$("#dots").onclick=e=>{if(e.target.dataset.w)gotoWs(+e.target.dataset.w)};
$("#cc").onclick=e=>{
 const b=e.target.closest("button");if(!b)return;
 const t=b.dataset.t,s=b.querySelector("small");
 if(t==="dark"){setTheme(isDark()?"light":"dark");return}
 if(t==="lock"){lock(true);return}
 if(t==="fs"){document.fullscreenElement?document.exitFullscreen():R.requestFullscreen&&R.requestFullscreen();return}
 b.classList.toggle("on");const on=b.classList.contains("on");S.tg[t]=on;save();
 s.textContent=t==="wifi"?(on?"Nava‑Home":"Off"):on?"On":"Off";
};
$("#br").oninput=e=>setBr(+e.target.value);$("#vol").oninput=e=>setVol(+e.target.value);
document.addEventListener("pointerdown",e=>{if(!e.target.closest("#cc,#st"))$("#cc").classList.remove("open")});
document.addEventListener("keydown",e=>{
 if((e.metaKey||e.ctrlKey||e.altKey)&&e.code==="Space"){e.preventDefault();cmd()}
 else if(e.key==="Escape"){cmd(false);$("#cc").classList.remove("open")}
 else if(e.altKey&&/^[1-3]$/.test(e.key)){gotoWs(+e.key-1)}
 else if(e.altKey&&e.key==="l"){lock(true)}
});
if(!S.acs.length&&(S.name||S.pw))S.acs=[{name:S.name||"User",pw:S.pw,c:S.acc}];dots();dock();applyS();syncDark();(S.lx||(S.lx=[])).slice().forEach(n=>addLx(n));if(!S.acs.length)showSetup(false);setInterval(()=>{clock();lockT()},15000);setTimeout(()=>$("#lp").focus(),150);
setTimeout(()=>$("#hint").style.display="none",9000);
openApp("terminal");
</script>
